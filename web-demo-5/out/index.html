<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Rentals (synthetic demo)</title>
<style>body{font-family:sans-serif;margin:0;background:#f4f5f7}header{background:#234;color:#fff;padding:12px}
form,.card{background:#fff;margin:8px;padding:10px;border-radius:8px}label{display:block;margin:4px 0}
input,select,textarea,button{width:100%%;padding:8px;box-sizing:border-box;font-size:16px}
.card b{float:right}#msg{color:green;margin:8px}</style></head><body>
<header><h1>Rentals</h1><small>Synthetic demo data</small></header>
<form id="post"><h2>Post a listing</h2>
<label>Category<select id="pcat"><option value="student">student</option><option value="residential">residential</option><option value="commercial">commercial</option><option value="services">services</option></select></label><label>Title<input id="ptitle"></label>
<label>Price<input id="pprice" type="number"></label><label>Location<select id="pcity"><option value="Northtown">Northtown</option><option value="Riverside">Riverside</option><option value="Hillcrest">Hillcrest</option><option value="Lakeview">Lakeview</option></select></label>
<button type="button" id="pbtn">Post</button></form>
<form id="filter"><h2>Filter</h2><label>Category<select id="fcat"><option value="">any</option><option value="student">student</option><option value="residential">residential</option><option value="commercial">commercial</option><option value="services">services</option></select></label>
<label>Max price<input id="fmax" type="number"></label>
<label>Location<select id="fcity"><option value="">any</option><option value="Northtown">Northtown</option><option value="Riverside">Riverside</option><option value="Hillcrest">Hillcrest</option><option value="Lakeview">Lakeview</option></select></label>
<button type="button" id="fbtn">Apply</button></form>
