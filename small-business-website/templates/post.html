<article class="post">
  <div class="container narrow">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="${root}index.html">Home</a></li>
        <li><a href="${root}blog/index.html">Blog</a></li>
        <li aria-current="page">$title</li>
      </ol>
    </nav>
    <header class="post-header">
      <h1>$title</h1>
      <p class="meta">
        <time datetime="$date_iso">$date</time> · $reading_time min read · by $site_name
      </p>
    </header>
    <div class="post-body">
      $body
    </div>
    <aside class="related">
      <h2>Related reading</h2>
      <ul>
        $related
      </ul>
    </aside>
    <p class="back-link"><a href="${root}blog/index.html">&larr; Back to all articles</a></p>
  </div>
</article>

<script type="application/ld+json">
$jsonld
</script>
<script type="application/ld+json">
$breadcrumb_jsonld
</script>
