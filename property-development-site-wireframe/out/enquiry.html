<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquire | Sample Development</title><style>body{font-family:Georgia,serif;margin:0;color:#222;background:#fafafa}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid #ccc}
nav a{margin-left:16px;color:#222;text-decoration:none;letter-spacing:.05em}
.box{border:2px dashed #999;background:#eee;display:flex;align-items:center;justify-content:center;color:#666}
.hero{height:320px;margin:16px 24px;font-size:20px}
section{padding:12px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{border:1px solid #bbb;padding:10px;background:#fff}.cta{display:inline-block;padding:10px 18px;border:2px solid #222;margin:6px;cursor:pointer;background:#fff}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:4px 8px;text-align:left}
form label{display:block;margin:8px 0}#result{margin-top:10px;font-weight:bold}
@media(max-width:600px){header{flex-direction:column}nav a{margin:4px}}</style></head><body data-page="enquiry"><header><strong>[LOGO] Sample Development</strong><nav><a href="index.html" data-nav="index">Home</a><a href="location.html" data-nav="location">Location</a><a href="homes.html" data-nav="homes">Homes</a><a href="enquiry.html" data-nav="enquiry">Enquire</a></nav></header><main><section><h2>Enquire</h2><form id="enquiry"><label>Name <input name="name" id="f-name"></label><label>Email <input name="contact" id="f-contact"></label><label>I want to <select name="intent" id="f-intent"><option value="details">Request details</option><option value="viewing">Book a viewing</option></select></label><label>Plot (optional) <input name="plot" id="f-plot"></label><button type="submit" class="cta" id="f-submit">Send</button></form><div id="result"></div></section><script>var q=new URLSearchParams(location.search);if(q.get("intent"))document.getElementById("f-intent").value=q.get("intent");if(q.get("plot"))document.getElementById("f-plot").value=q.get("plot");document.getElementById("enquiry").onsubmit=function(e){e.preventDefault();var n=this.name.value.trim(),c=this.contact.value,i=this.intent.value,r=document.getElementById("result");if(!n||!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(c)){r.textContent="Please add a name and a valid email.";return}r.textContent="Thanks - routed to "+(i==="viewing"?"sales-viewings":"sales-general")+" (demo, nothing sent).";}</script></main><footer><section>Wireframe only - synthetic content.</section></footer></body></html>
